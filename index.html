<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shay B Lamon – Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Jost:wght@400;500;600&family=Poiret+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf7e6;
  --bg-2:#f3eed6;
  --ink:#4b5a3b;
  --ink-soft:#7c8868;
  --accent:#6f8258;
  --line:rgba(75,90,59,.22);
  --chip-on-bg:#6f8258;
  --chip-on-ink:#fbf7e6;
  --head:'Gloock', Georgia, 'Times New Roman', serif;
  --body:'Jost', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --logo:'Poiret One', 'Gloock', Georgia, serif;
  --hdr-h:0px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a1e16;--bg-2:#22271d;--ink:#e6ebd4;--ink-soft:#a2ad8c;--accent:#a8bc8b;
    --line:rgba(230,235,212,.2);--chip-on-bg:#a8bc8b;--chip-on-ink:#1a1e16;
  }
}
:root[data-theme="dark"]{
  --bg:#1a1e16;--bg-2:#22271d;--ink:#e6ebd4;--ink-soft:#a2ad8c;--accent:#a8bc8b;
  --line:rgba(230,235,212,.2);--chip-on-bg:#a8bc8b;--chip-on-ink:#1a1e16;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:var(--body);font-size:16px;line-height:1.45;
  background-image:
    radial-gradient(900px 380px at 85% -60px, color-mix(in srgb,var(--accent) 14%, transparent), transparent 70%),
    radial-gradient(700px 300px at -10% 40%, color-mix(in srgb,var(--accent) 8%, transparent), transparent 70%);
  background-repeat:no-repeat;
}
a{color:inherit}
 
/* ---------- Masthead ---------- */
.masthead{
  max-width:760px;margin:0 auto;padding:44px 22px 26px;text-align:center;
}
.wordmark{
  font-family:var(--logo);font-weight:400;color:var(--accent);
  font-size:clamp(40px,12vw,76px);line-height:.95;letter-spacing:.02em;margin:0;
  text-transform:uppercase;
}
.subline{
  display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  margin:12px auto 0;max-width:560px;font-size:13px;color:var(--ink-soft);letter-spacing:.08em;
}
.subline strong{font-weight:500;font-size:clamp(14px,3.8vw,19px);color:var(--ink);letter-spacing:.06em}
.theme-btn{
  position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:14px;
  width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);
  cursor:pointer;font-size:17px;display:grid;place-items:center;
}
.theme-btn:focus-visible,.chip:focus-visible,.search input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
 
/* ---------- Sticky bar ---------- */
.bar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:color-mix(in srgb,var(--bg) 92%, transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
}
.bar-inner{max-width:760px;margin:0 auto;padding:10px 0 0}
.search{padding:0 18px 8px}
.search input{
  width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg-2);
  border:1px solid var(--line);border-radius:999px;padding:10px 16px;
}
.search input::placeholder{color:var(--ink-soft)}
.chips{
  display:flex;gap:8px;overflow-x:auto;padding:0 18px 12px;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;font:inherit;font-size:15px;font-weight:500;color:var(--ink);background:transparent;
  border:1px solid var(--line);border-radius:999px;padding:7px 15px;cursor:pointer;white-space:nowrap;
}
.chip[aria-current="true"]{background:var(--chip-on-bg);color:var(--chip-on-ink);border-color:var(--chip-on-bg)}
 
/* ---------- Menu ---------- */
main{max-width:760px;margin:0 auto;padding:6px 22px 60px}
.sec{scroll-margin-top:calc(var(--hdr-h) + env(safe-area-inset-top,0px) + 6px);padding-top:34px}
.sec > h2{
  font-family:var(--head);font-weight:400;font-size:clamp(34px,8.5vw,52px);line-height:1;
  margin:0 0 4px;color:var(--accent);
}
.grp{margin-top:22px}
.grp > h3{
  font-family:var(--head);font-weight:400;font-size:22px;margin:0 0 6px;color:var(--ink);
  padding-bottom:6px;border-bottom:1px solid var(--line);
}
.grp > p.gnote{margin:6px 0 0;font-size:14px;color:var(--ink-soft)}
.items{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr;column-gap:34px}
@media (min-width:640px){.items{grid-template-columns:1fr 1fr}}
.item{padding:13px 0 12px;border-bottom:1px dotted var(--line);break-inside:avoid}
.row{display:flex;align-items:baseline;gap:10px}
.name{font-family:var(--head);font-size:18px;line-height:1.2;flex:1 1 auto}
.price{flex:0 0 auto;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:17px}
.price small{font-size:11px;margin-left:2px;color:var(--ink-soft);letter-spacing:.06em;vertical-align:super}
.price.ask{font-weight:400;font-size:13px;color:var(--ink-soft);font-style:italic}
.desc{margin:4px 0 0;font-size:14px;color:var(--ink-soft);line-height:1.4;max-width:60ch}
.note{margin:3px 0 0;font-size:12.5px;color:var(--accent);font-weight:500}
.empty{display:none;text-align:center;color:var(--ink-soft);padding:60px 10px}
footer{max-width:760px;margin:0 auto;padding:10px 22px 50px;text-align:center;color:var(--ink-soft);font-size:13px}
footer p{margin:4px 0}
[hidden]{display:none !important}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
 
function itemHTML(it){
  const [name, price, desc, note] = it;
  const p = (price===null || price===undefined)
    ? '<span class="price ask">ask us</span>'
    : '<span class="price">'+price+'<small>LE</small></span>';
  return '<li class="item" data-s="'+esc((name+' '+(desc||'')+' '+(note||'')).toLowerCase())+'">'
    + '<div class="row"><span class="name">'+esc(name)+'</span>'+p+'</div>'
    + (desc?'<p class="desc">'+esc(desc)+'</p>':'')
    + (note?'<p class="note">'+esc(note)+'</p>':'')
    + '</li>';
}

      + '<ul class="items">'+g.items.map(itemHTML).join('')+'</ul></div>'

chipsEl.innerHTML = MENU.map((s,i) =>

/* chip navigation */
chipsEl.addEventListener('click', e=>{
  const b = e.target.closest('.chip'); if(!b) return;
  if (qEl.value){ qEl.value=''; applyFilter(''); }
  const t = document.getElementById(b.dataset.t);
  if (t) t.scrollIntoView({block:'start'});
});
 
/* scroll spy */
function spy(){
  const line = barEl.getBoundingClientRect().bottom + 24;
  let cur = null;
  document.querySelectorAll('.sec:not([hidden])').forEach(s=>{
    if (s.getBoundingClientRect().top <= line) cur = s.id;
  });
  if (!cur) cur = MENU[0].id;
  chipsEl.querySelectorAll('.chip').forEach(c=>{
    const on = c.dataset.t===cur;
    if (on) c.setAttribute('aria-current','true'); else c.removeAttribute('aria-current');
    if (on && !c._shown){ c._shown=true; }
  });
  const active = chipsEl.querySelector('[aria-current="true"]');
  if (active && active.dataset.t !== spy.last){
    spy.last = active.dataset.t;
    const r = active.getBoundingClientRect(), cr = chipsEl.getBoundingClientRect();
    if (r.left < cr.left+10 || r.right > cr.right-10){
      chipsEl.scrollTo({left: active.offsetLeft - 18, behavior:'smooth'});
    }
  }
}
let ticking=false;
window.addEventListener('scroll',()=>{ if(!ticking){ticking=true;requestAnimationFrame(()=>{spy();ticking=false;});} },{passive:true});
spy();
 
/* search */
function applyFilter(raw){
  const q = raw.trim().toLowerCase();
  let total = 0;
  document.querySelectorAll('.sec').forEach(sec=>{
    let secCount = 0;
    sec.querySelectorAll('.grp').forEach(g=>{
      let n = 0;
      g.querySelectorAll('.item').forEach(li=>{
        const hit = !q || li.dataset.s.indexOf(q) !== -1;
        li.hidden = !hit; if (hit) n++;
      });
      g.hidden = n===0; secCount += n;
    });
    sec.hidden = secCount===0; total += secCount;
  });
  emptyEl.style.display = total===0 ? 'block' : 'none';
  spy();
}
qEl.addEventListener('input', ()=>applyFilter(qEl.value));
 
/* theme toggle (per-session) */
const root = document.documentElement;
document.getElementById('themeBtn').addEventListener('click', ()=>{
  const dark = getComputedStyle(root).getPropertyValue('--bg').trim().toLowerCase() === '#1a1e16';
  root.setAttribute('data-theme', dark ? 'light' : 'dark');
});
</script>
